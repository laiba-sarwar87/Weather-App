<!DOCTYPE html>
<html>
<head>
<title>Weather App</title>
<style>
body{font-family:Arial; text-align:center; background:#aee2ff; padding:50px;}
.box{background:white; padding:30px; border-radius:20px; display:inline-block;}
input{padding:10px; border-radius:10px; border:1px solid #ccc;}
button{padding:10px 20px; border:none; background:#007bff; color:white; border-radius:10px; cursor:pointer;}
</style>
</head>
<body>
<div class="box">
<h1>🌤️ Weather App</h1>
<input id="city" placeholder="City likho - Lahore">
<button onclick="getWeather()">Check</button>
<h2 id="result"></h2>
<p id="temp"></p>
</div>
<script>
async function getWeather(){
let city = document.getElementById('city').value || 'Lahore';
let geo = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${city}&count=1&language=en&format=json`);
let geoData = await geo.json();
let lat = geoData.results[0].latitude;
let lon = geoData.results[0].longitude;
let res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code`);
let data = await res.json();
document.getElementById('result').innerText = city;
document.getElementById('temp').innerText = "Temperature: " + data.current.temperature_2m + "°C";
}
</script>
</body>
</html>
